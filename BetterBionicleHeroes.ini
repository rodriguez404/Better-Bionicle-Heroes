[VezonExtra]
; 1 = after Vezon is beaten, each zone level keeps its boss AND adds Vezon as an extra character
;     (mouse wheel: ... -> zone boss -> Vezon -> ...). 0 = vanilla (Vezon replaces the boss).
ExtraCharacter = 1
; 1 = Vezon can no longer use the zone bosses' constructions; he keeps his own (black) ones.
;     Only with ExtraCharacter = 1 (otherwise Vezon is the only Piraka and needs those powers).
RestrictVezonPowers = 1
; 1 = keep the zone boss and Vezon loaded together so switching between them is instant
;     (0 = reload the model on every switch, ~40 ms hitch)
InstantSwap = 1

[Debug]
; 1 = if the game freezes, write where it is stuck to BetterBionicleHeroes.log (wait ~20 s, then close it)
HangWatchdog = 1
