[VezonExtra]
; 1 = after Vezon is beaten, each zone level keeps its boss AND adds Vezon as an extra character
;     (mouse wheel: ... -> zone boss -> Vezon -> ...). 0 = vanilla (Vezon replaces the boss).
ExtraCharacter = 1
; 1 = Vezon can no longer use the zone bosses' constructions; he keeps his own (black) ones.
;     Only with ExtraCharacter = 1 (otherwise Vezon is the only Piraka and needs those powers).
RestrictVezonPowers = 1
; 1 = keep the zone boss and Vezon loaded together so switching between them is instant
;     (0 = reload the model on every switch, ~40 ms hitch)
InstantSwap = 1

[CutsceneSkip]
; 1 = in-level cutscenes can be skipped with Esc (the game's own, normally developer-only, skip)
;     and with the ExtraKeys below
Enabled = 1
; more keys that skip a cutscene, comma-separated: Space, Enter, Backspace, Tab, LMB, RMB, MMB,
; Shift, Ctrl, Alt, a letter or digit (e.g. E), or a Windows virtual-key code (e.g. 0x20).
; Leave empty for Esc only.
ExtraKeys = Space

[Intro]
; 1 = skip the Eidos / Traveller's Tales logo movies at startup
SkipLogos = 1
; 1 = skip the story intro movie at startup (only the first time it plays in a session)
SkipIntro = 1
; 1 = skip the LEGO Star Wars advert that plays when the title menu is left idle
SkipAttract = 1

[PauseMenu]
; 1 = Esc on the top level of the pause menu closes it and resumes the game (like "Resume");
;     in submenus Esc still goes one level up
EscResumes = 1

[Menus]
; 1 = two-option confirmations start on the first option: YES in the shop and on the save / load
;     screens, QUIT on the quit prompts, EXIT LEVEL after a boss (the game starts them on NO /
;     CANCEL / RESUME)
ConfirmDefaultYes = 1

[Display]
; 1 = the video options list the resolutions your monitor supports (up to the desktop resolution)
;     instead of the game's fixed list (640x480 .. 1600x1200)
ResolutionList = 1
; 1 = also list resolutions above the desktop one (e.g. NVIDIA DSR / AMD VSR)
AboveDesktop = 0
; 1 = fullscreen runs at the refresh rate set in Windows (the game alone always picks 60 Hz)
MatchRefreshRate = 1
; a fixed refresh rate in Hz instead of the Windows one (0 = same as Windows). If the resolution
; doesn't support it, the closest lower rate is used. Needs MatchRefreshRate = 1.
RefreshRate = 0

[Fixes]
; 1 = Thok's ice beam damages enemies (in the original game it never does: the weapon doesn't fire
;     every frame, so the beam restarts all the time and never reaches a damage tick)
ThokBeamDamage = 1
; 1 = Nuparu dig spots show earth and grass in levels whose data lacks those textures (e.g. the third
;     ice level), instead of a lump of flat grey quads. The textures come from your own bionicle.dat.
DigSpotGrass = 1

[Debug]
; 1 = if the game freezes, write where it is stuck to BetterBionicleHeroes.log (wait ~20 s, then close it)
HangWatchdog = 1
